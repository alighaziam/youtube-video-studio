<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persian Subtitle Preview</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 24px; background: #111827; color: #f9fafb; }
    main { max-width: 960px; margin: auto; }
    canvas { display: block; width: 100%; height: auto; background: #20252b; border: 1px solid #4b5563; }
    p { color: #cbd5e1; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>معاينة زیرنویس فارسی</h1>
    <canvas id="preview" width="1280" height="720" aria-label="Persian subtitle preview"></canvas>
    <p>این پیش‌نمایش از فونت‌های نصب‌شده روی سیستم مرورگر استفاده می‌کند. برای مقایسه، خروجی FFmpeg را نیز از مسیر <code>output/persian-subtitle.mp4</code> باز کنید.</p>
  </main>
  <script>
    const canvas = document.getElementById("preview");
    const ctx = canvas.getContext("2d");
    const text = "این یک آزمایش واقعی برای نمایش زیرنویس فارسی است.";
    ctx.fillStyle = "#20252b";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.direction = "rtl";
    ctx.textAlign = "center";
    ctx.textBaseline = "alphabetic";
    ctx.font = '42px "Noto Sans Arabic", "Noto Naskh Arabic", Tahoma, sans-serif';
    const x = canvas.width / 2;
    const y = canvas.height - 72;
    const metrics = ctx.measureText(text);
    const width = metrics.width;
    const height = (metrics.actualBoundingBoxAscent || 42) + (metrics.actualBoundingBoxDescent || 10);
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(x - width / 2 - 18, y - height - 12, width + 36, height + 24);
    ctx.lineWidth = 3;
    ctx.strokeStyle = "#101010";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = "#ffffff";
    ctx.fillText(text, x, y);
  </script>
</body>
</html>
